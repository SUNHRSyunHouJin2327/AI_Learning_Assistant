# /etc/nginx/sites-available/ai-agent  — replace ai.example.com with your domain.
# Certbot adds the 443/ssl lines and an HTTP->HTTPS redirect to this file.
#
# Access control (separate from the app's BNBU login): Basic Auth once at /__gate,
# which sets a random gate cookie; every other request needs that cookie.
# Basic Auth cannot guard every request because the app sends its own
# "Authorization: Bearer" header, which makes the browser re-prompt endlessly.
#
# ecs-domain-setup.sh creates the two files below with a random token:
#   /etc/nginx/conf.d/aila-gate.conf             (map $cookie_aila_gate -> $aila_gate_ok)
#   /etc/nginx/snippets/aila-gate-cookie.conf    (add_header Set-Cookie ...)
server {
    listen 80;
    server_name ai.example.com;

    # "return" runs before the access phase and would skip auth_basic,
    # so hand off with try_files (runs after auth) to a named location.
    location = /__gate {
        auth_basic "AI Learning Assistant";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-agent;
        try_files /nonexistent @gate_ok;
    }

    location @gate_ok {
        include /etc/nginx/snippets/aila-gate-cookie.conf;
        return 302 /ui/;
    }

    location / {
        if ($aila_gate_ok = 0) {
            return 302 /__gate;
        }

        proxy_pass http://127.0.0.1:14242;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        client_max_body_size 50m;
    }
}

# Requests by bare IP or any other host name get no content.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
