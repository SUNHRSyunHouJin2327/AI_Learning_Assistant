# /etc/nginx/sites-available/ai-agent  — replace ai.example.com with your domain.
# Certbot will add the 443/ssl block automatically; keep the auth_basic lines in it.
server {
    listen 80;
    server_name ai.example.com;

    location / {
        auth_basic "AI Learning Assistant";
        auth_basic_user_file /etc/nginx/.htpasswd-ai-agent;

        proxy_pass http://127.0.0.1:14242;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        client_max_body_size 50m;
    }
}
